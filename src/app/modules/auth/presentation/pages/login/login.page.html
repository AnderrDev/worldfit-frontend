<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <div class="page-card p-4">
      <h1 class="h4 mb-2">{{ mode === 'login' ? 'Inicio de sesión' : 'Registro de usuario' }}</h1>
      <p class="text-muted">
        {{ mode === 'login' ? 'El usuario administrador queda cargado para probar los CRUD.' : 'Registra un usuario con nombre, correo y contraseña.' }}
      </p>

      <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>
      <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3" *ngIf="mode === 'register'">
          <label class="form-label">Nombre</label>
          <input class="form-control" type="text" formControlName="fullName" placeholder="Nombre completo">
        </div>

        <div class="mb-3">
          <label class="form-label">Correo</label>
          <input class="form-control" type="email" formControlName="email" autocomplete="email">
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input class="form-control" type="password" formControlName="password" autocomplete="current-password">
        </div>

        <button class="btn btn-primary w-100" type="submit" [disabled]="form.invalid">
          {{ mode === 'login' ? 'Entrar' : 'Registrarme' }}
        </button>
      </form>

      <hr>

      <div class="text-center">
        <button class="btn btn-link" type="button" *ngIf="mode === 'login'" (click)="showRegister()">
          Crear una cuenta nueva
        </button>
        <button class="btn btn-link" type="button" *ngIf="mode === 'register'" (click)="showLogin()">
          Volver al inicio de sesión
        </button>
      </div>
    </div>
  </div>
</div>
