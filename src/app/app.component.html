<a class="wf-skip" href="#wf-main">Saltar al contenido</a>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/routines">WorldFit</a>

    <div class="d-flex gap-2 align-items-center">
      <a class="nav-link text-white" routerLink="/routines" routerLinkActive="fw-bold text-warning">
        Rutinas
      </a>
      <a class="nav-link text-white" routerLink="/exercises" routerLinkActive="fw-bold text-warning">
        Ejercicios
      </a>
      <a class="nav-link text-white" *ngIf="session.isAdmin" routerLink="/users" routerLinkActive="fw-bold text-warning">
        Usuarios
      </a>
      <span class="badge text-bg-warning" *ngIf="isLoggedIn">{{ session.role }}</span>
      <a class="btn btn-outline-light btn-sm" *ngIf="!isLoggedIn" routerLink="/auth">
        Entrar
      </a>
      <button type="button" class="btn btn-danger btn-sm" *ngIf="isLoggedIn" (click)="logout()">
        Salir
      </button>
    </div>
  </div>
</nav>

<main id="wf-main" class="container py-4">
  <router-outlet></router-outlet>
</main>

<footer class="border-top bg-white py-3">
  <div class="container small text-muted">
    {{ title }} - Proyecto academico {{ year }}
  </div>
</footer>
