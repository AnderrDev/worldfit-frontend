# SonarCloud configuration - WorldFit Frontend
# Reemplaza <TU_ORG> y <TU_PROJECT_KEY> con los valores reales de tu cuenta SonarCloud

sonar.projectKey=<TU_ORG>_worldfit-frontend
sonar.organization=<TU_ORG>
sonar.projectName=WorldFit Frontend
sonar.projectVersion=0.1.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts

# Coverage report producido por karma-coverage (configurado en angular.json)
sonar.javascript.lcov.reportPaths=coverage/worldfit-frontend/lcov.info
sonar.typescript.lcov.reportPaths=coverage/worldfit-frontend/lcov.info

sonar.sourceEncoding=UTF-8
