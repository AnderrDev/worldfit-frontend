# SonarCloud configuration - WorldFit Frontend
# org/projectKey rellenados para AnderrDev.
# Si SonarCloud te muestra una "organization key" distinta (a veces en minusculas),
# ajusta ambas lineas con el valor exacto que veas en la UI.

sonar.projectKey=AnderrDev_worldfit-frontend
sonar.organization=AnderrDev
sonar.projectName=WorldFit Frontend
sonar.projectVersion=0.1.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts

# Coverage report producido por karma-coverage (configurado en angular.json)
sonar.javascript.lcov.reportPaths=coverage/worldfit-frontend/lcov.info
sonar.typescript.lcov.reportPaths=coverage/worldfit-frontend/lcov.info

sonar.sourceEncoding=UTF-8
